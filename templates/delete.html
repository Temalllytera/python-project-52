{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1 class="mb-5">{{ title }}</h1>
<div class="row">
    <div class="col-md-6 offset-md-3">
        <p>Вы уверены, что хотите удалить
            {{ user_object.first_name }} {{ user_object.last_name }}?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">{{ button_text }}</button>
        </form>
    </div>
</div>
{% endblock %}

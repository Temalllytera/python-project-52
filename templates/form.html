{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1 class="mb-5">{{ title }}</h1>
<div class="row">
    <div class="col-md-6 offset-md-3">
        <form method="post">
            {% csrf_token %}
            {% bootstrap_form form %}
            <button type="submit" class="btn btn-primary">{{ button_text }}</button>
        </form>
    </div>
</div>
{% endblock %}

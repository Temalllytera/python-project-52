{% extends 'base.html' %}

{% block content %}
<div class="rounded-lg bg-white p-10 shadow">
    <h1 class="mb-4 text-4xl font-bold">Привет от Хекслета!</h1>
    <p class="mb-6 max-w-2xl text-lg text-gray-600">
        Ставьте задачи, назначайте исполнителей, отслеживайте статусы
        и группируйте работу метками.
    </p>
    {% if user.is_authenticated %}
        <a class="inline-block rounded-md bg-blue-600 px-6 py-3 text-white hover:bg-blue-700"
           href="{% url 'tasks_index' %}">Узнать больше</a>
    {% else %}
        <a class="inline-block rounded-md bg-blue-600 px-6 py-3 text-white hover:bg-blue-700"
           href="{% url 'user_create' %}">Узнать больше</a>
    {% endif %}
</div>
{% endblock %}

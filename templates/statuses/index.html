{% extends 'base.html' %}

{% block title %}Статусы{% endblock %}

{% block content %}
<h1 class="mb-6 text-3xl font-bold">Статусы</h1>
<a class="mb-6 inline-block rounded-md bg-blue-600 px-5 py-2 text-white hover:bg-blue-700"
   href="{% url 'status_create' %}">Создать статус</a>
<div class="overflow-x-auto rounded-lg bg-white shadow">
    <table class="min-w-full text-left text-sm">
        <thead class="border-b bg-gray-100 text-xs uppercase text-gray-600">
            <tr>
                <th class="px-4 py-3">ID</th>
                <th class="px-4 py-3">Имя</th>
                <th class="px-4 py-3">Дата создания</th>
                <th class="px-4 py-3"></th>
            </tr>
        </thead>
        <tbody>
            {% for status in statuses %}
            <tr class="border-b last:border-0">
                <td class="px-4 py-3">{{ status.id }}</td>
                <td class="px-4 py-3">{{ status.name }}</td>
                <td class="px-4 py-3">{{ status.created_at|date:"d.m.Y H:i" }}</td>
                <td class="space-x-3 px-4 py-3">
                    <a class="text-blue-600 hover:underline"
                       href="{% url 'status_update' status.id %}">Изменить</a>
                    <a class="text-red-600 hover:underline"
                       href="{% url 'status_delete' status.id %}">Удалить</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}

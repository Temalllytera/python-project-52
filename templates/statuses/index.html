{% extends 'base.html' %}

{% block title %}Статусы{% endblock %}

{% block content %}
<h1 class="mb-5">Статусы</h1>
<a class="btn btn-primary mb-3" href="{% url 'status_create' %}">Создать статус</a>
<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Дата создания</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for status in statuses %}
        <tr>
            <td>{{ status.id }}</td>
            <td>{{ status.name }}</td>
            <td>{{ status.created_at|date:"d.m.Y H:i" }}</td>
            <td>
                <a href="{% url 'status_update' status.id %}">Изменить</a>
                <a href="{% url 'status_delete' status.id %}" class="text-danger">Удалить</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}

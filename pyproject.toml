[project]
name = "hexlet-code"
version = "0.1.0"
description = "Task Manager"
requires-python = ">=3.10"
dependencies = [
    "django>=5.2",
    "python-dotenv>=1.0",
    "dj-database-url>=2.2",
    "psycopg2-binary>=2.9",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    "django-filter>=26.1",
    "sentry-sdk>=2.68.0",
    "django-tailwind-cli>=4.7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "coverage>=7.6",
]

[tool.ruff]
exclude = [
    "migrations",
    "task_manager/settings.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.coverage.run]
source = ["task_manager"]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/apps.py",
    "*/asgi.py",
    "*/wsgi.py",
    "manage.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
